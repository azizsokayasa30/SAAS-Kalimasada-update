# Kalimasada SaaS — Nginx reverse proxy (auto-generated)
# Generated: 2026-11-12T10:17:24.028Z
# Jangan edit manual — gunakan Management Portal /management/settings/reverse-proxy
# Subdomain tenant (1): mobile

upstream kalimasada_app {
    server 127.0.0.1:4555;
    keepalive 32;
}

# SSL diminta tetapi sertifikat belum tersedia — hanya HTTP yang diaktifkan
# Sertifikat belum ada: /etc/letsencrypt/live/kalimasada-app.com/fullchain.pem. Jalankan certbot terlebih dahulu.

server {
    listen 80;
    listen [::]:80;
    server_name *.kalimasada-app.com manage.kalimasada-app.com mobile.kalimasada-app.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://kalimasada_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }
}

# Routing:
#   manage.kalimasada-app.com  → Management Portal
#   mobile.kalimasada-app.com  → Mobile API hub
#   mobile.kalimasada-app.com  → Tenant: mobile (lokal 127.0.0.1:4555)
#   *.kalimasada-app.com         → Wildcard (tenant baru otomatis)
#   kalimasada-app.com           → Website utama (statis, bukan SaaS)
#   http://103.132.40.78/     → Akses LAN (IP langsung)
#   http://103.132.40.78:4555/  → Node langsung (tanpa nginx)

# Website utama (apex domain) — bukan layanan billing/SaaS
server {
    listen 80;
    listen [::]:80;
    server_name kalimasada-app.com www.kalimasada-app.com;
    root /var/www/kalimasada-web;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Akses LAN / IP langsung (HTTP port 80, tanpa domain)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 103.132.40.78 _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://kalimasada_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }
}
